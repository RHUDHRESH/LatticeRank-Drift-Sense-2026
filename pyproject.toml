[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latticerank-drift-sense"
version = "2.0.0"
description = "CPU edge registration for SEM and GDS inputs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "Pillow==12.3.0",
  "opencv-python-headless==5.0.0.93",
  "gdstk==1.0.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
include = ["driftforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
