<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Phase 1 image-registration foundation</title><desc id="d">Reference and search images are normalized, correlated, refined, checked for ambiguity and converted to a location and confidence.</desc>
<rect width="1200" height="320" rx="20" fill="#f6f8fa"/><text x="40" y="48" font-family="Segoe UI,Arial" font-size="26" font-weight="700" fill="#17232b">Phase 1 · registration foundation</text><text x="40" y="77" font-family="Segoe UI,Arial" font-size="15" fill="#52616b">The base location problem that Phase 2 extends with pose and edge-domain evidence.</text>
<g font-family="Segoe UI,Arial" text-anchor="middle"><g fill="#e7f2f8" stroke="#27759a" stroke-width="2"><rect x="38" y="122" width="145" height="85" rx="12"/><rect x="213" y="122" width="145" height="85" rx="12"/></g><text x="110" y="156" font-size="16" font-weight="700">Reference</text><text x="285" y="156" font-size="16" font-weight="700">Search image</text><text x="110" y="181" font-size="13">small crop</text><text x="285" y="181" font-size="13">wide field</text>
<rect x="408" y="122" width="155" height="85" rx="12" fill="#e8f5ef" stroke="#23805d" stroke-width="2"/><text x="485" y="156" font-size="16" font-weight="700">Normalize</text><text x="485" y="181" font-size="13">robust contrast</text><rect x="613" y="102" width="175" height="125" rx="12" fill="#fff5df" stroke="#bb7b13" stroke-width="2"/><text x="700" y="139" font-size="16" font-weight="700">Correlation map</text><text x="700" y="165" font-size="13">scan locations</text><text x="700" y="189" font-size="13">retain peaks</text><rect x="838" y="122" width="145" height="85" rx="12" fill="#f0ecfa" stroke="#7254a5" stroke-width="2"/><text x="910" y="156" font-size="16" font-weight="700">Refine</text><text x="910" y="181" font-size="13">subpixel x/y</text><rect x="1033" y="122" width="130" height="85" rx="12" fill="#17232b"/><text x="1098" y="156" font-size="16" font-weight="700" fill="white">Decision</text><text x="1098" y="181" font-size="13" fill="#dbe4e9">found + score</text></g><g stroke="#758690" stroke-width="3"><path d="M183 164h20M358 164h40M563 164h40M788 164h40M983 164h40"/></g>
