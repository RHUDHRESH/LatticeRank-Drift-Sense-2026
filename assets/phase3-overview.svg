<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Phase 3 CAD to SEM registration</title>
  <desc id="desc">Layered GDS polygons are converted to independent edge evidence and matched against a SEM search while allowing invisible layers.</desc>
  <defs><linearGradient id="bg3" x2="1" y2="1"><stop stop-color="#112127"/><stop offset="1" stop-color="#203c49"/></linearGradient></defs>
  <rect width="720" height="400" rx="24" fill="url(#bg3)"/>
  <text x="34" y="48" fill="#91d8ff" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2">PHASE 3 · CAD → SEM</text>
  <text x="34" y="82" fill="#f4f9fc" font-family="Segoe UI,Arial" font-size="25" font-weight="700">Match geometry even when a layer disappears</text>
  <g transform="translate(55 123)">
    <rect x="34" y="0" width="145" height="145" rx="12" fill="#2b5060" stroke="#75caff" stroke-width="2"/>
    <path d="M50 26h112v24H50zm0 70h112v24H50z" fill="#70c6f0" opacity=".88"/>
    <path d="M70 8v130M115 8v130M155 8v130" stroke="#f0b46b" stroke-width="11" opacity=".78"/>
    <rect x="15" y="20" width="145" height="145" rx="12" fill="none" stroke="#f0b46b" stroke-width="2" opacity=".7"/>
    <rect x="0" y="40" width="145" height="145" rx="12" fill="none" stroke="#b397f3" stroke-width="2" opacity=".8"/>
  </g>
  <text x="92" y="333" fill="#c4d7df" font-family="Segoe UI,Arial" font-size="16">Layered GDS</text>
  <path d="M250 209h78" stroke="#91d8ff" stroke-width="4"/><path d="m316 198 14 11-14 11" fill="none" stroke="#91d8ff" stroke-width="4"/>
  <g transform="translate(356 122)">
    <rect width="305" height="180" rx="15" fill="#172a2f" stroke="#536f78" stroke-width="2"/>
    <path d="M18 32h269M18 72h269M18 112h269M18 152h269" stroke="#81969a" stroke-width="5" opacity=".72"/>
    <path d="M48 18v144M104 18v144M160 18v144M216 18v144M272 18v144" stroke="#d4dcda" stroke-width="7" opacity=".6"/>
    <rect x="196" y="85" width="56" height="56" fill="none" stroke="#91d8ff" stroke-width="4"/>
    <path d="M20 150h267" stroke="#172a2f" stroke-width="15"/>
  </g>
  <text x="450" y="333" fill="#c4d7df" font-family="Segoe UI,Arial" font-size="16">SEM search · fixed pose</text>
  <g font-family="Segoe UI,Arial" font-size="13" font-weight="600">
    <rect x="70" y="350" width="170" height="30" rx="15" fill="#dbeefa"/><text x="94" y="370" fill="#17668d">independent layer edges</text>
    <rect x="274" y="350" width="173" height="30" rx="15" fill="#dbeefa"/><text x="298" y="370" fill="#17668d">visibility-aware fitting</text>
    <rect x="480" y="350" width="163" height="30" rx="15" fill="#dbeefa"/><text x="508" y="370" fill="#17668d">subpixel translation</text>
  </g>
</svg>
