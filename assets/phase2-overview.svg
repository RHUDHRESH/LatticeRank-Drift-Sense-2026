<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 SEM to SEM registration</title>
  <desc id="desc">A small reference tile is matched inside a wider SEM search field using edges, pose estimation and subpixel refinement.</desc>
  <defs>
    <pattern id="cells" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M4 0v28M12 0v28M20 0v28" stroke="#9bb0ae" stroke-width="3"/><path d="M0 14h28" stroke="#324c4d" stroke-width="6"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e2528"/><stop offset="1" stop-color="#174445"/></linearGradient>
  </defs>
  <rect width="720" height="400" rx="24" fill="url(#bg)"/>
  <text x="34" y="48" fill="#8fe0c8" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2">PHASE 2 · SEM → SEM</text>
  <text x="34" y="82" fill="#f3fbf8" font-family="Segoe UI,Arial" font-size="25" font-weight="700">Locate the reference tile in a noisy search</text>
  <rect x="42" y="127" width="160" height="160" rx="15" fill="url(#cells)" stroke="#eef8f4" stroke-width="3"/>
  <text x="83" y="316" fill="#c2d5d2" font-family="Segoe UI,Arial" font-size="16">Reference</text>
  <path d="M224 207h70" stroke="#8fe0c8" stroke-width="4"/><path d="m282 196 14 11-14 11" fill="none" stroke="#8fe0c8" stroke-width="4"/>
  <rect x="318" y="112" width="356" height="190" rx="17" fill="url(#cells)" stroke="#557574" stroke-width="2"/>
  <rect x="510" y="145" width="76" height="76" fill="none" stroke="#8fe0c8" stroke-width="4"/>
  <circle cx="548" cy="183" r="6" fill="#8fe0c8"/>
  <text x="458" y="331" fill="#c2d5d2" font-family="Segoe UI,Arial" font-size="16">Wide SEM search</text>
  <g font-family="Segoe UI,Arial" font-size="14" font-weight="600">
    <rect x="62" y="350" width="150" height="30" rx="15" fill="#dff3eb"/><text x="89" y="370" fill="#087f74">1 · detect edges</text>
    <rect x="244" y="350" width="194" height="30" rx="15" fill="#dff3eb"/><text x="267" y="370" fill="#087f74">2 · estimate scale + angle</text>
    <rect x="470" y="350" width="188" height="30" rx="15" fill="#dff3eb"/><text x="491" y="370" fill="#087f74">3 · refine subpixel x/y</text>
  </g>
</svg>
