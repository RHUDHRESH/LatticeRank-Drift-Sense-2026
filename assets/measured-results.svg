<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Measured registration results</title>
  <desc id="desc">Verified Phase 2 and Phase 3 metrics, separated from harsher diagnostic stress tests.</desc>
  <rect width="720" height="400" rx="24" fill="#f4f1e9"/>
  <text x="34" y="48" fill="#087f74" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2">MEASURED RESULTS</text>
  <text x="34" y="82" fill="#15272b" font-family="Segoe UI,Arial" font-size="25" font-weight="700">Official-compatible results and hard stress checks</text>
  <g font-family="Segoe UI,Arial">
    <rect x="34" y="112" width="205" height="120" rx="16" fill="#ffffff" stroke="#d6dcd8"/>
    <text x="54" y="142" fill="#657579" font-size="12" font-weight="700">PHASE 2 · OFFICIAL 25</text><text x="54" y="185" fill="#087f74" font-size="36" font-weight="800">72.98<tspan font-size="16"> / 85</tspan></text><text x="54" y="212" fill="#657579" font-size="13">F1 0.919 · median 0.495 px</text>
    <rect x="257" y="112" width="205" height="120" rx="16" fill="#ffffff" stroke="#d6dcd8"/>
    <text x="277" y="142" fill="#657579" font-size="12" font-weight="700">PHASE 3 · GENERATED 25</text><text x="277" y="185" fill="#17668d" font-size="36" font-weight="800">24<tspan font-size="16"> / 24 ≤2 px</tspan></text><text x="277" y="212" fill="#657579" font-size="13">F1 0.980 · median 0.709 px</text>
    <rect x="480" y="112" width="206" height="120" rx="16" fill="#ffffff" stroke="#d6dcd8"/>
    <text x="500" y="142" fill="#657579" font-size="12" font-weight="700">EXECUTION</text><text x="500" y="185" fill="#493b86" font-size="36" font-weight="800">0<tspan font-size="16"> failures</tspan></text><text x="500" y="212" fill="#657579" font-size="13">25/25 rows in both runs</text>
    <rect x="34" y="256" width="652" height="105" rx="16" fill="#152d31"/>
    <text x="55" y="287" fill="#8fe0c8" font-size="12" font-weight="700">HARDER DIAGNOSTIC SUITES · NOT OFFICIAL SCORES</text>
    <text x="55" y="324" fill="#f3faf8" font-size="18" font-weight="700">Phase 2: 59.91/85</text><text x="244" y="324" fill="#bacdca" font-size="14">candidate retention + confidence</text>
    <text x="55" y="348" fill="#f3faf8" font-size="18" font-weight="700">Phase 3: 8/8 negatives accepted</text><text x="356" y="348" fill="#bacdca" font-size="14">rejection is the urgent gap</text>
  </g>
</svg>
