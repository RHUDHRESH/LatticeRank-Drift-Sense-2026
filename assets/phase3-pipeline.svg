<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
<title id="t">Phase 3 CAD-to-SEM pipeline</title><desc id="d">Independent GDS layers propose locations, fit observed SEM appearance, refine translation and decide presence.</desc>
<rect width="1200" height="380" rx="20" fill="#f6f8fa"/><text x="40" y="45" font-family="Segoe UI,Arial" font-size="25" font-weight="700" fill="#17232b">Phase 3 · CAD → SEM</text>
<g font-family="Segoe UI,Arial" text-anchor="middle"><rect x="35" y="85" width="155" height="82" rx="12" fill="#e7f2f8" stroke="#27759a" stroke-width="2"/><text x="112" y="116" font-size="15" font-weight="700">Reference GDS</text><text x="112" y="141" font-size="13">polygons + units</text><rect x="35" y="225" width="155" height="82" rx="12" fill="#f0ecfa" stroke="#7254a5" stroke-width="2"/><text x="112" y="256" font-size="15" font-weight="700">Search SEM</text><text x="112" y="281" font-size="13">normalize + edges</text>
<rect x="235" y="85" width="175" height="82" rx="12" fill="#e8f5ef" stroke="#23805d" stroke-width="2"/><text x="322" y="116" font-size="15" font-weight="700">Independent masks</text><text x="322" y="141" font-size="13">fractional coverage</text><rect x="455" y="65" width="205" height="122" rx="12" fill="#fff5df" stroke="#bb7b13" stroke-width="2"/><text x="557" y="94" font-size="15" font-weight="700">Candidate proposals</text><text x="557" y="119" font-size="13">pooled + per-layer edges</text><text x="557" y="141" font-size="13">vector/raster search GDS</text><text x="557" y="163" font-size="13">remote alternatives</text>
<rect x="705" y="65" width="210" height="122" rx="12" fill="#f0ecfa" stroke="#7254a5" stroke-width="2"/><text x="810" y="94" font-size="15" font-weight="700">Layer-aware fit</text><text x="810" y="119" font-size="13">estimate SEM effects</text><text x="810" y="141" font-size="13">held-out yield fit</text><text x="810" y="163" font-size="13">missing layer → zero</text><rect x="960" y="85" width="175" height="82" rx="12" fill="#fbeaea" stroke="#a74343" stroke-width="2"/><text x="1047" y="116" font-size="15" font-weight="700">Subpixel refine</text><text x="1047" y="141" font-size="13">translation + aliases</text>
<rect x="440" y="260" width="205" height="72" rx="12" fill="#e8f5ef" stroke="#23805d" stroke-width="2"/><text x="542" y="289" font-size="15" font-weight="700">Presence decision</text><text x="542" y="313" font-size="13">SEM + CAD evidence</text><rect x="720" y="260" width="225" height="72" rx="12" fill="#17232b"/><text x="832" y="289" font-size="15" font-weight="700" fill="white">Prediction CSV</text><text x="832" y="313" font-size="13" fill="#dbe4e9">x · y · 0° · 10× · score</text></g>
